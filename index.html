<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차량 운행 및 출퇴근 달력 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen p-2 md:p-8 flex flex-col items-center">

    <div class="max-w-5xl w-full mx-auto bg-white rounded-xl shadow-md overflow-hidden p-4 md:p-6">
        <!-- 상단 달력 컨트롤러 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-gray-200 gap-4">
            <h1 id="calendarMonthTitle" class="text-2xl font-bold text-gray-800">2026년 8월 운행 달력</h1>
            
            <!-- ⭐ 정산 버튼 및 달력 이동 버튼 -->
            <div class="flex items-center gap-2">
                <button onclick="openSummaryModal()" class="px-4 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-bold shadow-sm transition">💰 정산보기</button>
                <div class="h-5 border-l border-gray-300 mx-1"></div>
                <button onclick="changeMonth(-1)" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium transition">◀ 이전 달</button>
                <button onclick="changeMonth(1)" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium transition">다음 달 ▶</button>
            </div>
        </header>

        <!-- 달력 요일 헤더 -->
        <div class="grid grid-cols-7 gap-1 text-center font-semibold mb-2 text-sm md:text-base">
            <div class="text-red-500">일</div>
            <div class="text-gray-600">월</div>
            <div class="text-gray-600">화</div>
            <div class="text-gray-600">수</div>
            <div class="text-gray-600">목</div>
            <div class="text-gray-600">금</div>
            <div class="text-blue-500">토</div>
        </div>
        
        <!-- 달력 그리드 -->
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 md:gap-2 auto-rows-fr">
            <!-- 달력 날짜 동적 생성 -->
        </div>
    </div>

    <!-- ⭐ 1. 월간 정산 내역 팝업 모달창 -->
    <div id="summaryModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl max-w-3xl w-full p-5 shadow-xl relative my-auto" onclick="event.stopPropagation()">
            <h2 id="summaryModalTitle" class="text-xl font-bold text-gray-800 mb-4 border-b pb-3">📊 8월 정산 내역</h2>
            
            <div class="overflow-x-auto max-h-80 md:max-h-96 overflow-y-auto mb-4 border border-gray-200 rounded-lg">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead class="bg-gray-100 sticky top-0 z-10 shadow-sm">
                        <tr class="text-sm text-gray-700">
                            <th class="p-3 border-b whitespace-nowrap">날짜</th>
                            <th class="p-3 border-b whitespace-nowrap">운전원</th>
                            <th class="p-3 border-b text-center whitespace-nowrap">시간</th>
                            <th class="p-3 border-b text-center whitespace-nowrap">보상시간</th>
                            <th class="p-3 border-b text-right whitespace-nowrap">정산금액</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody" class="text-sm">
                        <!-- JS로 정산 내역 리스트 삽입 -->
                    </tbody>
                </table>
            </div>

            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 flex flex-col md:flex-row justify-between items-center gap-3">
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-600 text-sm">보상 시간 합계:</span>
                    <span id="summaryTotalHours" class="text-blue-700 font-bold text-xl">0.0 h</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-600 text-sm">비용 정산 합계:</span>
                    <span id="summaryTotalAllowance" class="text-green-700 font-bold text-xl">0 원</span>
                </div>
            </div>

            <div class="flex justify-end pt-4 mt-2">
                <button type="button" onclick="closeSummaryModal()" class="px-5 py-2.5 bg-gray-600 hover:bg-gray-700 text-white rounded-lg font-bold text-sm shadow">닫기</button>
            </div>
        </div>
    </div>

    <!-- 2. 일정 입력 팝업 모달창 -->
    <div id="logModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl max-w-lg w-full p-5 shadow-xl relative my-auto" onclick="event.stopPropagation()">
            <h2 id="modalDateTitle" class="text-xl font-bold text-gray-800 mb-3 border-b pb-2">📅 날짜 운행 정보</h2>
            
            <form id="logForm" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">운행 일정 (비용 정산)</label>
                    <select id="scheduleType" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium">
                        <option value="none">일정 선택 안함</option>
                        <option value="seoul">서울당일 (정산 0원)</option>
                        <option value="day">당일 (일비 12,500원)</option>
                        <option value="1night">1박 (하루당 37,500원)</option>
                        <option value="2night">2박 (하루당 37,500원)</option>
                        <option value="linked" hidden>연계 일정 (이전 날짜에서 이어짐)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">운전원 1</label>
                        <input type="text" id="driver1" placeholder="이름" class="w-full border border-gray-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">운전원 2 (선택)</label>
                        <input type="text" id="driver2" placeholder="이름" class="w-full border border-gray-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <!-- 1일차 -->
                <div id="day1Box" class="bg-blue-50 border border-blue-100 p-3 rounded-lg">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-sm text-blue-800" id="day1Label">1일차 시간 (당일)</span>
                        <label class="flex items-center gap-1 text-xs font-medium text-red-600 bg-white px-2 py-1 rounded border border-gray-200 cursor-pointer shadow-sm">
                            <input type="checkbox" id="isHoliday1" class="accent-red-500 w-3 h-3"> 휴일적용
                        </label>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" step="0.5" inputmode="decimal" id="startTime1" placeholder="출근 (예: 9)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm" required>
                        <input type="number" step="0.5" inputmode="decimal" id="endTime1" placeholder="퇴근 (예: 1, 18.5)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm" required>
                    </div>
                </div>

                <!-- 2일차 -->
                <div id="day2Box" class="bg-indigo-50 border border-indigo-100 p-3 rounded-lg hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-sm text-indigo-800" id="day2Label">2일차 시간</span>
                        <label class="flex items-center gap-1 text-xs font-medium text-red-600 bg-white px-2 py-1 rounded border border-gray-200 cursor-pointer shadow-sm">
                            <input type="checkbox" id="isHoliday2" class="accent-red-500 w-3 h-3"> 휴일적용
                        </label>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" step="0.5" inputmode="decimal" id="startTime2" placeholder="출근 (예: 9)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm">
                        <input type="number" step="0.5" inputmode="decimal" id="endTime2" placeholder="퇴근 (예: 18.5)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm">
                    </div>
                </div>

                <!-- 3일차 -->
                <div id="day3Box" class="bg-purple-50 border border-purple-100 p-3 rounded-lg hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-sm text-purple-800" id="day3Label">3일차 시간</span>
                        <label class="flex items-center gap-1 text-xs font-medium text-red-600 bg-white px-2 py-1 rounded border border-gray-200 cursor-pointer shadow-sm">
                            <input type="checkbox" id="isHoliday3" class="accent-red-500 w-3 h-3"> 휴일적용
                        </label>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" step="0.5" inputmode="decimal" id="startTime3" placeholder="출근 (예: 9)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm">
                        <input type="number" step="0.5" inputmode="decimal" id="endTime3" placeholder="퇴근 (예: 18.5)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">비고 및 목적</label>
                    <input type="text" id="memo" placeholder="예: 본사 ↔ 공장" class="w-full border border-gray-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-medium text-sm">취소</button>
                    <button type="submit" id="saveBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-sm shadow">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let selectedDateStr = "";
        
        let logsData = JSON.parse(localStorage.getItem('drivingLogs')) || {};

        function saveToLocal() {
            localStorage.setItem('drivingLogs', JSON.stringify(logsData));
            renderCalendar();
        }

        window.onload = function() {
            renderCalendar();
        };

        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; } 
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function addDays(dateStr, days) {
            const parts = dateStr.split('-');
            const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            d.setDate(d.getDate() + days);
            const outY = d.getFullYear();
            const outM = String(d.getMonth() + 1).padStart(2, '0');
            const outD = String(d.getDate()).padStart(2, '0');
            return `${outY}-${outM}-${outD}`;
        }

        const holidaysMap = {
            "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일",
            "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "성탄절",
            "2026-02-16": "설날연휴", "2026-02-17": "설날", "2026-02-18": "설날연휴",
            "2026-03-02": "대체공휴일", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
            "2026-09-24": "추석연휴", "2026-09-25": "추석", "2026-09-26": "추석연휴",
            "2027-02-06": "설날연휴", "2027-02-07": "설날", "2027-02-08": "설날연휴", "2027-02-09": "대체공휴일",
            "2027-05-13": "부처님오신날", "2027-09-14": "추석연휴", "2027-09-15": "추석", "2027-09-16": "추석연휴"
        };

        function getHolidayName(dateStr) {
            if (holidaysMap[dateStr]) return holidaysMap[dateStr];
            const mmdd = dateStr.substring(5);
            if (holidaysMap[mmdd]) return holidaysMap[mmdd];
            return null;
        }

        function calculateOvertime(startStr, endStr, isHoliday) {
            if (!startStr || !endStr) return { totalPayTime: 0, label: "" };
            let startVal = parseFloat(startStr);
            let endVal = parseFloat(endStr);
            if (isNaN(startVal) || isNaN(endVal)) return { totalPayTime: 0, label: "" };

            if (endVal <= startVal) {
                endVal += 24.0; // 새벽퇴근 반영
            }

            const overlapStart = Math.max(startVal, 9.0);
            const overlapEnd = Math.min(endVal, 18.0);
            let rawNormalHours = (overlapEnd > overlapStart) ? overlapEnd - overlapStart : 0;
            
            let restTime = (rawNormalHours >= 4) ? 1.0 : 0;
            let normalHours = Math.max(0, rawNormalHours - restTime); 
            
            let overtimeHours = Math.max(0, (endVal - startVal) - rawNormalHours);

            if (isHoliday) {
                const holidayPay = (normalHours * 1.5) + (overtimeHours * 2.0);
                return { totalPayTime: holidayPay.toFixed(1), label: "휴일보상" };
            } else {
                const weekdayPay = (overtimeHours * 1.5);
                return { totalPayTime: weekdayPay.toFixed(1), label: "평일연장" };
            }
        }

        function calculateAllowance(log) {
            if (log.scheduleType === 'day') return 12500;
            if (log.scheduleType === '1night' || log.scheduleType === '2night') return 37500;
            if (log.scheduleType === 'linked' && (log.parentType === '1night' || log.parentType === '2night')) return 37500;
            return 0;
        }

        function renderCalendar() {
            const titleEl = document.getElementById('calendarMonthTitle');
            const gridEl = document.getElementById('calendarGrid');
            titleEl.textContent = `${currentYear}년 ${currentMonth + 1}월 운행 달력`;
            gridEl.innerHTML = "";

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                gridEl.innerHTML += `<div class="min-h-[6rem] bg-gray-50 rounded-lg opacity-40 border border-gray-100"></div>`;
            }

            for (let day = 1; day <= lastDay; day++) {
                const monthStr = String(currentMonth + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

                const dayOfWeek = new Date(currentYear, currentMonth, day).getDay();
                const isSunday = (dayOfWeek === 0);
                const isSaturday = (dayOfWeek === 6);
                const holidayName = getHolidayName(dateKey);

                let dateColorClass = "text-gray-800";
                let dateBadgeHTML = "";
                
                if (holidayName) {
                    dateColorClass = "text-red-500";
                    dateBadgeHTML = `<span class="text-[10px] text-red-500 ml-1 font-normal tracking-tighter">(${holidayName})</span>`;
                } else if (isSunday) {
                    dateColorClass = "text-red-500";
                } else if (isSaturday) {
                    dateColorClass = "text-blue-500";
                }

                const log = logsData[dateKey];
                
                let cellBgClass = 'bg-white border-gray-200 hover:border-blue-400';
                if (log) {
                    if (log.scheduleType === '1night' || (log.scheduleType === 'linked' && log.parentType === '1night')) {
                        cellBgClass = 'bg-indigo-100 border-indigo-300 hover:border-indigo-500';
                    } else if (log.scheduleType === '2night' || (log.scheduleType === 'linked' && log.parentType === '2night')) {
                        cellBgClass = 'bg-purple-100 border-purple-300 hover:border-purple-500';
                    }
                }

                let contentHTML = ``;

                if (log) {
                    const calc = calculateOvertime(log.startTime, log.endTime, log.isHoliday);
                    const allowance = calculateAllowance(log);
                    
                    let allowanceHTML = '';
                    if (allowance > 0) {
                        allowanceHTML = `<div class="text-[11px] font-bold text-green-800 bg-green-200 rounded px-1 mt-0.5 text-center shadow-sm whitespace-nowrap">💰 ${allowance.toLocaleString()}원</div>`;
                    } else if (log.scheduleType === 'seoul' || (log.scheduleType === 'linked' && log.parentType === 'seoul')) {
                        allowanceHTML = `<div class="text-[11px] font-bold text-gray-600 bg-gray-200 rounded px-1 mt-0.5 text-center shadow-sm whitespace-nowrap">서울당일</div>`;
                    }

                    const driver2HTML = log.driver2 ? `<div class="text-[11px] font-semibold text-indigo-900 bg-indigo-200 rounded px-1 mt-0.5 shadow-sm whitespace-nowrap">${log.driver2}</div>` : '';
                    const payColor = log.isHoliday ? 'text-red-700 bg-red-100 border-red-200' : 'text-gray-800 bg-gray-100 border-gray-300';

                    contentHTML = `
                        <div class="text-[11px] font-semibold text-blue-900 bg-blue-200 rounded px-1 shadow-sm whitespace-nowrap">${log.driver1}</div>
                        ${driver2HTML}
                        <div class="text-[10px] text-gray-700 bg-white/60 border border-gray-200 rounded px-1 mt-1 text-center font-bold shadow-sm whitespace-nowrap tracking-tighter">⏰ ${log.startTime} ~ ${log.endTime}</div>
                        <div class="text-[10px] font-bold border rounded px-1 mt-0.5 ${payColor} shadow-sm whitespace-nowrap text-center">${calc.label}: ${calc.totalPayTime}h</div>
                        ${allowanceHTML}
                    `;
                }

                gridEl.innerHTML += `
                    <div onclick="openModal('${dateKey}')" class="h-full min-h-[6rem] ${cellBgClass} border rounded-lg p-1 md:p-1.5 cursor-pointer transition shadow-sm flex flex-col">
                        <div class="flex items-center ml-1">
                            <span class="text-xs font-bold ${dateColorClass}">${day}</span>
                            ${dateBadgeHTML}
                        </div>
                        <div class="flex flex-col gap-0.5 mt-1">${contentHTML}</div>
                    </div>
                `;
            }
        }

        // ⭐ 정산내역 모달 열기 기능
        window.openSummaryModal = function() {
            const tbody = document.getElementById('summaryTableBody');
            const title = document.getElementById('summaryModalTitle');
            tbody.innerHTML = "";
            title.textContent = `📊 ${currentYear}년 ${currentMonth + 1}월 정산 내역`;

            let totalHours = 0;
            let totalAllowance = 0;
            
            // 현재 보고있는 달의 데이터만 필터링 (ex: "2026-08")
            const targetPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            
            // 날짜순으로 정렬
            const sortedKeys = Object.keys(logsData)
                .filter(key => key.startsWith(targetPrefix))
                .sort();

            if (sortedKeys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-5 text-center text-gray-500 font-medium">이번 달 운행 내역이 없습니다.</td></tr>`;
            } else {
                sortedKeys.forEach(key => {
                    const log = logsData[key];
                    const calc = calculateOvertime(log.startTime, log.endTime, log.isHoliday);
                    const allowance = calculateAllowance(log);

                    totalHours += parseFloat(calc.totalPayTime || 0);
                    totalAllowance += allowance;

                    const drivers = log.driver2 ? `${log.driver1}, ${log.driver2}` : log.driver1;
                    const dateObj = new Date(key);
                    const dayStr = ["일","월","화","수","목","금","토"][dateObj.getDay()];
                    
                    let allowanceStr = "-";
                    if(allowance > 0) allowanceStr = `💰 ${allowance.toLocaleString()}원`;
                    else if(log.scheduleType === 'seoul' || (log.scheduleType === 'linked' && log.parentType === 'seoul')) allowanceStr = '서울당일';

                    const payColor = log.isHoliday ? 'text-red-500' : 'text-blue-600';

                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50 transition">
                            <td class="p-3 font-medium text-gray-700">${key.split('-')[2]}일 (${dayStr})</td>
                            <td class="p-3 text-gray-800">${drivers}</td>
                            <td class="p-3 text-center text-xs text-gray-500 bg-gray-50">⏰ ${log.startTime}~${log.endTime}</td>
                            <td class="p-3 text-center font-bold ${payColor}">${calc.totalPayTime}h</td>
                            <td class="p-3 text-right font-bold text-green-700">${allowanceStr}</td>
                        </tr>
                    `;
                });
            }

            // 총합 업데이트
            document.getElementById('summaryTotalHours').textContent = totalHours.toFixed(1) + " h";
            document.getElementById('summaryTotalAllowance').textContent = totalAllowance.toLocaleString() + " 원";

            document.getElementById('summaryModal').classList.remove('hidden');
        }

        // 정산내역 모달 닫기
        window.closeSummaryModal = function() {
            document.getElementById('summaryModal').classList.add('hidden');
        }
        document.getElementById('summaryModal').addEventListener('click', function() { window.closeSummaryModal(); });

        document.getElementById('scheduleType').addEventListener('change', function(e) {
            const val = e.target.value;
            const day2 = document.getElementById('day2Box');
            const day3 = document.getElementById('day3Box');

            if (val === '1night') {
                day2.classList.remove('hidden'); day3.classList.add('hidden');
                document.getElementById('startTime2').required = true;
                document.getElementById('endTime2').required = true;
                document.getElementById('startTime3').required = false;
                document.getElementById('endTime3').required = false;
            } else if (val === '2night') {
                day2.classList.remove('hidden'); day3.classList.remove('hidden');
                document.getElementById('startTime2').required = true;
                document.getElementById('endTime2').required = true;
                document.getElementById('startTime3').required = true;
                document.getElementById('endTime3').required = true;
            } else {
                day2.classList.add('hidden'); day3.classList.add('hidden');
                document.getElementById('startTime2').required = false;
                document.getElementById('endTime2').required = false;
                document.getElementById('startTime3').required = false;
                document.getElementById('endTime3').required = false;
            }
        });

        window.openModal = function(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modalDateTitle').textContent = `📅 ${dateStr} 운행 정보`;
            
            document.getElementById('logForm').reset();
            document.getElementById('scheduleType').value = "none";
            ['1', '2', '3'].forEach(num => {
                document.getElementById(`startTime${num}`).value = "";
                document.getElementById(`endTime${num}`).value = "";
                document.getElementById(`isHoliday${num}`).checked = false; 
            });

            document.getElementById('day2Box').classList.add('hidden');
            document.getElementById('day3Box').classList.add('hidden');
            document.getElementById('scheduleType').disabled = false;

            const checkIsHolidayByDefault = (dStr) => {
                const parts = dStr.split('-');
                const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                const dayOfWeek = d.getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6) return true; 
                if (getHolidayName(dStr)) return true; 
                return false;
            };

            document.getElementById('isHoliday1').checked = checkIsHolidayByDefault(dateStr);
            document.getElementById('isHoliday2').checked = checkIsHolidayByDefault(addDays(dateStr, 1));
            document.getElementById('isHoliday3').checked = checkIsHolidayByDefault(addDays(dateStr, 2));

            if (logsData[dateStr]) {
                const data = logsData[dateStr];
                document.getElementById('driver1').value = data.driver1 || "";
                document.getElementById('driver2').value = data.driver2 || "";
                document.getElementById('startTime1').value = data.startTime || "";
                document.getElementById('endTime1').value = data.endTime || "";
                document.getElementById('isHoliday1').checked = data.isHoliday || false;
                document.getElementById('memo').value = data.memo || "";
                document.getElementById('scheduleType').value = data.scheduleType || "none";

                if(data.scheduleType === 'linked') {
                    document.getElementById('scheduleType').disabled = true;
                }

                if (data.scheduleType === '1night' || data.scheduleType === '2night') {
                    document.getElementById('scheduleType').dispatchEvent(new Event('change'));
                    
                    const day2Data = logsData[addDays(dateStr, 1)];
                    if (day2Data) {
                        document.getElementById('startTime2').value = day2Data.startTime || "";
                        document.getElementById('endTime2').value = day2Data.endTime || "";
                        document.getElementById('isHoliday2').checked = day2Data.isHoliday || false;
                    }
                    
                    if (data.scheduleType === '2night') {
                        const day3Data = logsData[addDays(dateStr, 2)];
                        if (day3Data) {
                            document.getElementById('startTime3').value = day3Data.startTime || "";
                            document.getElementById('endTime3').value = day3Data.endTime || "";
                            document.getElementById('isHoliday3').checked = day3Data.isHoliday || false;
                        }
                    }
                }
            }

            document.getElementById('logModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('logModal').classList.add('hidden');
            document.getElementById('logForm').reset();
            ['1', '2', '3'].forEach(num => {
                document.getElementById(`isHoliday${num}`).checked = false; 
            });
        }

        const timeInputs = document.querySelectorAll('input[type="number"]');
        timeInputs.forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
            });
            input.addEventListener('change', function() { this.blur(); });
        });

        document.getElementById('logModal').addEventListener('click', function() { window.closeModal(); });

        document.getElementById('logForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const scheduleType = document.getElementById('scheduleType').value;
            const driver1 = document.getElementById('driver1').value;
            const driver2 = document.getElementById('driver2').value;
            const memo = document.getElementById('memo').value;

            const date1 = selectedDateStr;
            const date2 = addDays(date1, 1);
            const date3 = addDays(date1, 2);
            
            let currentParentType = "";
            if (logsData[date1] && logsData[date1].scheduleType === 'linked') {
                currentParentType = logsData[date1].parentType;
            }

            if (scheduleType === 'linked') {
                logsData[date1] = {
                    date: date1,
                    scheduleType: 'linked',
                    parentType: currentParentType,
                    driver1: driver1,
                    driver2: driver2,
                    startTime: document.getElementById('startTime1').value,
                    endTime: document.getElementById('endTime1').value,
                    isHoliday: document.getElementById('isHoliday1').checked,
                    memo: memo
                };
            } else {
                logsData[date1] = {
                    date: date1,
                    scheduleType: scheduleType,
                    driver1: driver1,
                    driver2: driver2,
                    startTime: document.getElementById('startTime1').value,
                    endTime: document.getElementById('endTime1').value,
                    isHoliday: document.getElementById('isHoliday1').checked,
                    memo: memo
                };

                if (scheduleType === '1night' || scheduleType === '2night') {
                    logsData[date2] = {
                        date: date2,
                        scheduleType: 'linked',
                        parentType: scheduleType,
                        parentDate: date1, 
                        driver1: driver1,
                        driver2: driver2,
                        startTime: document.getElementById('startTime2').value,
                        endTime: document.getElementById('endTime2').value,
                        isHoliday: document.getElementById('isHoliday2').checked,
                        memo: memo + " (2일차)"
                    };
                }
                if (scheduleType === '2night') {
                    logsData[date3] = {
                        date: date3,
                        scheduleType: 'linked',
                        parentType: scheduleType,
                        parentDate: date1,
                        driver1: driver1,
                        driver2: driver2,
                        startTime: document.getElementById('startTime3').value,
                        endTime: document.getElementById('endTime3').value,
                        isHoliday: document.getElementById('isHoliday3').checked,
                        memo: memo + " (3일차)"
                    };
                }

                if (scheduleType !== '2night') {
                    if (logsData[date3] && logsData[date3].parentDate === date1) { delete logsData[date3]; }
                }
                if (scheduleType !== '1night' && scheduleType !== '2night') {
                    if (logsData[date2] && logsData[date2].parentDate === date1) { delete logsData[date2]; }
                }
            }

            saveToLocal();
            window.closeModal();
        });
    </script>
</body>
</html>
