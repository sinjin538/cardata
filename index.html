<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차량 운행 및 출퇴근 달력 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <!-- 상단 달력 컨트롤러 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-gray-200 gap-4">
            <h1 id="calendarMonthTitle" class="text-2xl font-bold text-gray-800">2026년 8월 운행 달력</h1>
            <div class="flex items-center gap-2">
                <button onclick="changeMonth(-1)" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium">◀ 이전 달</button>
                <button onclick="changeMonth(1)" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium">다음 달 ▶</button>
            </div>
        </header>

        <!-- 달력 그리드 -->
        <div class="grid grid-cols-7 gap-1 text-center font-semibold text-gray-600 mb-2">
            <div class="text-red-500">일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div class="text-blue-500">토</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-2">
            <!-- 달력 날짜들이 동적으로 생성됩니다 -->
        </div>
    </div>

    <!-- 팝업 모달창 -->
    <div id="logModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl relative" onclick="event.stopPropagation()">
            <h2 id="modalDateTitle" class="text-xl font-bold text-gray-800 mb-4">날짜 운행 정보</h2>
            
            <form id="logForm" class="space-y-4">
                
                <!-- ⭐ 추가 포인트: 일정 선택 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">운행 일정 (비용 정산)</label>
                    <select id="scheduleType" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="none">일정 선택 안함</option>
                        <option value="seoul">서울당일 (정산 없음)</option>
                        <option value="day">당일 (일비 12,500원)</option>
                        <option value="1night">1박 (일비+식비 37,500원)</option>
                        <option value="2night">2박 (일비+식비 75,000원)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">운전원 1</label>
                        <input type="text" id="driver1" placeholder="이름 입력" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">운전원 2 (선택)</label>
                        <input type="text" id="driver2" placeholder="없을 시 비워둠" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">출근 시간 (예: 6, 6.5)</label>
                        <input type="number" step="0.5" inputmode="decimal" id="startTime" placeholder="예: 6" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-center relative" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">퇴근 시간 (예: 18, 18.5)</label>
                        <input type="number" step="0.5" inputmode="decimal" id="endTime" placeholder="예: 18.5" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-center relative" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">비고 및 목적</label>
                    <input type="text" id="memo" placeholder="예: 본사 ↔ 공장 왕복" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-medium">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase 설정 및 연동 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 본인의 파이어베이스 설정값으로 교체하세요
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let selectedDateStr = "";
        let logsData = {}; 

        onSnapshot(collection(db, "drivingLogs"), (snapshot) => {
            logsData = {};
            snapshot.forEach((doc) => {
                logsData[doc.id] = doc.data();
            });
            renderCalendar();
        });

        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        // 연장 근로 보상 시간 계산
        function calculateOvertime(dateStr, startStr, endStr) {
            if (!startStr || !endStr) return { totalOvertimePayTime: 0 };
            const dateObj = new Date(dateStr);
            const isWeekend = (dateObj.getDay() === 0 || dateObj.getDay() === 6);
            const startVal = parseFloat(startStr);
            const endVal = parseFloat(endStr);
            if (isNaN(startVal) || isNaN(endVal) || endVal <= startVal) return { totalOvertimePayTime: 0 };

            const standardStart = 9.0;
            const standardEnd = 18.0;
            let normalHours = 0;
            let overtimeHours = 0;

            if (isWeekend) {
                overtimeHours = endVal - startVal;
            } else {
                const overlapStart = Math.max(startVal, standardStart);
                const overlapEnd = Math.min(endVal, standardEnd);
                if (overlapEnd > overlapStart) {
                    normalHours = overlapEnd - overlapStart;
                }
                overtimeHours = Math.max(0, (endVal - startVal) - normalHours);
            }
            return { totalOvertimePayTime: (overtimeHours * 1.5).toFixed(1) };
        }

        // ⭐ 비용 정산 계산 (일정 타입 기준)
        function calculateAllowance(type) {
            if (type === 'day') return 12500; // 당일: 일비
            if (type === '1night') return 12500 + 25000; // 1박: 일비 + 식비 (37,500)
            if (type === '2night') return (12500 + 25000) * 2; // 2박: (일비 + 식비) x 2 (75,000)
            return 0; // seoul 또는 none
        }

        function renderCalendar() {
            const titleEl = document.getElementById('calendarMonthTitle');
            const gridEl = document.getElementById('calendarGrid');
            
            titleEl.textContent = `${currentYear}년 ${currentMonth + 1}월 운행 달력`;
            gridEl.innerHTML = "";

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                gridEl.innerHTML += `<div class="h-32 bg-gray-100 rounded-lg opacity-40"></div>`;
            }

            // ⭐ 1박/2박 달력 배경색 유지를 위한 변수
            let tripDaysRemaining = 0;
            let activeTripColorClass = '';

            for (let day = 1; day <= lastDay; day++) {
                const monthStr = String(currentMonth + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

                const log = logsData[dateKey];

                // 일정(scheduleType)이 있으면 연속 박(Night)수 계산하여 색상 칠할 일수 세팅
                if (log && log.scheduleType === '1night') {
                    tripDaysRemaining = 2; // 오늘 + 내일
                    activeTripColorClass = 'bg-blue-50 border-blue-300';
                } else if (log && log.scheduleType === '2night') {
                    tripDaysRemaining = 3; // 오늘 + 내일 + 모레
                    activeTripColorClass = 'bg-purple-50 border-purple-300';
                }

                // 기본 배경색 vs 출장(1박, 2박) 배경색 적용
                let cellBgClass = 'bg-white border-gray-200 hover:border-blue-500 hover:shadow-sm';
                if (tripDaysRemaining > 0) {
                    cellBgClass = `${activeTripColorClass} hover:brightness-95`;
                    tripDaysRemaining--; // 하루 그렸으므로 차감
                }

                let contentHTML = `<div class="text-xs text-gray-400 mt-1">입력 대기</div>`;

                if (log) {
                    const calc = calculateOvertime(dateKey, log.startTime, log.endTime);
                    const allowance = calculateAllowance(log.scheduleType);
                    
                    // 정산 금액 태그 생성
                    let allowanceHTML = '';
                    if (allowance > 0) {
                        allowanceHTML = `<div class="text-[10px] font-bold text-green-700 bg-green-100 border border-green-300 rounded px-1 mt-1 truncate">💰 정산: ${allowance.toLocaleString()}원</div>`;
                    } else if (log.scheduleType === 'seoul') {
                        allowanceHTML = `<div class="text-[10px] font-bold text-gray-600 bg-gray-200 border border-gray-300 rounded px-1 mt-1 truncate">서울당일 (정산 0원)</div>`;
                    }

                    contentHTML = `
                        <div class="text-[10px] text-blue-800 bg-blue-100 rounded px-1 truncate">1: ${log.driver1 || '-'}</div>
                        <div class="text-[10px] text-indigo-800 bg-indigo-100 rounded px-1 truncate">2: ${log.driver2 || '-'}</div>
                        <div class="text-[10px] text-gray-600 mt-0.5">${log.startTime || ''} ~ ${log.endTime || ''}</div>
                        <div class="text-[10px] font-bold text-red-600 bg-red-50 border border-red-200 rounded px-1 mt-1">연장: +${calc.totalOvertimePayTime}시간</div>
                        ${allowanceHTML}
                    `;
                }

                gridEl.innerHTML += `
                    <div onclick="openModal('${dateKey}')" class="h-32 ${cellBgClass} border rounded-lg p-2 cursor-pointer transition flex flex-col justify-between overflow-hidden">
                        <span class="text-sm font-semibold text-gray-800">${day}</span>
                        <div class="overflow-hidden flex flex-col gap-0.5">${contentHTML}</div>
                    </div>
                `;
            }
        }

        window.openModal = function(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modalDateTitle').textContent = `📅 ${dateStr} 운행 정보`;
            
            // 초기화
            document.getElementById('scheduleType').value = "none";
            document.getElementById('driver1').value = "";
            document.getElementById('driver2').value = "";
            document.getElementById('startTime').value = "";
            document.getElementById('endTime').value = "";
            document.getElementById('memo').value = "";

            if (logsData[dateStr]) {
                const data = logsData[dateStr];
                document.getElementById('scheduleType').value = data.scheduleType || "none";
                document.getElementById('driver1').value = data.driver1 || "";
                document.getElementById('driver2').value = data.driver2 || "";
                document.getElementById('startTime').value = data.startTime || "";
                document.getElementById('endTime').value = data.endTime || "";
                document.getElementById('memo').value = data.memo || "";
            }

            document.getElementById('logModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('logModal').classList.add('hidden');
        }

        const timeInputs = document.querySelectorAll('input[type="number"]');
        timeInputs.forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault(); 
                    this.blur(); 
                }
            });
            input.addEventListener('change', function() {
                this.blur();
            });
        });

        document.getElementById('logModal').addEventListener('click', function() {
            window.closeModal();
        });

        document.getElementById('logForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const scheduleType = document.getElementById('scheduleType').value;
            const driver1 = document.getElementById('driver1').value;
            const driver2 = document.getElementById('driver2').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const memo = document.getElementById('memo').value;

            window.closeModal();

            try {
                // 저장 시 일정 타입(scheduleType)도 함께 저장
                await setDoc(doc(db, "drivingLogs", selectedDateStr), {
                    date: selectedDateStr,
                    scheduleType,
                    driver1,
                    driver2,
                    startTime,
                    endTime,
                    memo,
                    updatedAt: new Date()
                });
            } catch (error) {
                console.error("저장 실패: ", error);
                alert("데이터 저장에 실패했습니다.");
            }
        });
    </script>
</body>
</html>
