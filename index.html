<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차량 운행 및 출퇴근 달력 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen p-2 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-4 md:p-6">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-gray-200 gap-4">
            <h1 id="calendarMonthTitle" class="text-2xl font-bold text-gray-800">2026년 8월 운행 달력</h1>
            <div class="flex items-center gap-2">
                <button onclick="changeMonth(-1)" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium">◀ 이전 달</button>
                <button onclick="changeMonth(1)" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium">다음 달 ▶</button>
            </div>
        </header>

        <div class="grid grid-cols-7 gap-1 text-center font-semibold text-gray-600 mb-2 text-sm md:text-base">
            <div class="text-red-500">일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div class="text-blue-500">토</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 md:gap-2">
            <!-- 달력 날짜들이 동적으로 생성됩니다 -->
        </div>
    </div>

    <!-- 팝업 모달창 -->
    <div id="logModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-xl max-w-lg w-full p-5 shadow-xl relative my-auto" onclick="event.stopPropagation()">
            <h2 id="modalDateTitle" class="text-xl font-bold text-gray-800 mb-3 border-b pb-2">📅 날짜 운행 정보</h2>
            
            <form id="logForm" class="space-y-3">
                <!-- 일정 선택 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">운행 일정 (비용 정산)</label>
                    <select id="scheduleType" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium">
                        <option value="none">일정 선택 안함</option>
                        <option value="seoul">서울당일 (정산 0원)</option>
                        <option value="day">당일 (일비 12,500원)</option>
                        <option value="1night">1박 (하루당 37,500원)</option>
                        <option value="2night">2박 (하루당 37,500원)</option>
                        <option value="linked" hidden>연계 일정 (이전 날짜에서 이어짐)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">운전원 1</label>
                        <input type="text" id="driver1" placeholder="이름" class="w-full border border-gray-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">운전원 2 (선택)</label>
                        <input type="text" id="driver2" placeholder="이름" class="w-full border border-gray-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <!-- 1일차 입력 (기본) -->
                <div id="day1Box" class="bg-blue-50 border border-blue-100 p-3 rounded-lg">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-sm text-blue-800" id="day1Label">1일차 시간 (당일)</span>
                        <label class="flex items-center gap-1 text-xs font-medium text-red-600 bg-white px-2 py-1 rounded border border-gray-200 cursor-pointer shadow-sm">
                            <input type="checkbox" id="isHoliday1" class="accent-red-500 w-3 h-3"> 휴일 (2.0배)
                        </label>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" step="0.5" inputmode="decimal" id="startTime1" placeholder="출근 (예: 6)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm" required>
                        <input type="number" step="0.5" inputmode="decimal" id="endTime1" placeholder="퇴근 (예: 18.5)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm" required>
                    </div>
                </div>

                <!-- 2일차 입력 (1박 이상 시 등장) -->
                <div id="day2Box" class="bg-indigo-50 border border-indigo-100 p-3 rounded-lg hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-sm text-indigo-800" id="day2Label">2일차 시간</span>
                        <label class="flex items-center gap-1 text-xs font-medium text-red-600 bg-white px-2 py-1 rounded border border-gray-200 cursor-pointer shadow-sm">
                            <input type="checkbox" id="isHoliday2" class="accent-red-500 w-3 h-3"> 휴일 (2.0배)
                        </label>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" step="0.5" inputmode="decimal" id="startTime2" placeholder="출근 (예: 6)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm">
                        <input type="number" step="0.5" inputmode="decimal" id="endTime2" placeholder="퇴근 (예: 18.5)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm">
                    </div>
                </div>

                <!-- 3일차 입력 (2박 시 등장) -->
                <div id="day3Box" class="bg-purple-50 border border-purple-100 p-3 rounded-lg hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-sm text-purple-800" id="day3Label">3일차 시간</span>
                        <label class="flex items-center gap-1 text-xs font-medium text-red-600 bg-white px-2 py-1 rounded border border-gray-200 cursor-pointer shadow-sm">
                            <input type="checkbox" id="isHoliday3" class="accent-red-500 w-3 h-3"> 휴일 (2.0배)
                        </label>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" step="0.5" inputmode="decimal" id="startTime3" placeholder="출근 (예: 6)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm">
                        <input type="number" step="0.5" inputmode="decimal" id="endTime3" placeholder="퇴근 (예: 18.5)" class="w-full border border-gray-300 rounded-lg px-2 py-1.5 outline-none text-center text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">비고 및 목적</label>
                    <input type="text" id="memo" placeholder="예: 본사 ↔ 공장" class="w-full border border-gray-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-medium text-sm">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-sm">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 본인의 파이어베이스 설정값으로 교체
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let selectedDateStr = "";
        let logsData = {}; 

        // 데이터 실시간 감지
        onSnapshot(collection(db, "drivingLogs"), (snapshot) => {
            logsData = {};
            snapshot.forEach((doc) => {
                logsData[doc.id] = doc.data();
            });
            renderCalendar();
        });

        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; } 
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        // ⭐ 확실한 로컬 날짜(한국시간) 더하기 헬퍼 함수 (버그 수정됨)
        function addDays(dateStr, days) {
            const parts = dateStr.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            d.setDate(d.getDate() + days);
            
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // 평일(1.5배) / 휴일(2.0배) 보상시간 계산기
        function calculateOvertime(startStr, endStr, isHoliday) {
            if (!startStr || !endStr) return { totalPayTime: 0, label: "" };
            const startVal = parseFloat(startStr);
            const endVal = parseFloat(endStr);
            if (isNaN(startVal) || isNaN(endVal) || endVal <= startVal) return { totalPayTime: 0, label: "" };

            let overtimeHours = 0;
            if (isHoliday) {
                overtimeHours = endVal - startVal;
                return { totalPayTime: (overtimeHours * 2.0).toFixed(1), label: "휴일보상" };
            } else {
                const overlapStart = Math.max(startVal, 9.0);
                const overlapEnd = Math.min(endVal, 18.0);
                let normalHours = (overlapEnd > overlapStart) ? overlapEnd - overlapStart : 0;
                overtimeHours = Math.max(0, (endVal - startVal) - normalHours);
                return { totalPayTime: (overtimeHours * 1.5).toFixed(1), label: "평일연장" };
            }
        }

        // ⭐ 비용 정산 로직 변경: 1박, 2박 시 "매일매일 37,500원씩" 출력되도록 설계
        function calculateAllowance(log) {
            if (log.scheduleType === 'day') return 12500;
            if (log.scheduleType === '1night' || log.scheduleType === '2night') return 37500;
            if (log.scheduleType === 'linked' && (log.parentType === '1night' || log.parentType === '2night')) return 37500;
            return 0;
        }

        function renderCalendar() {
            const titleEl = document.getElementById('calendarMonthTitle');
            const gridEl = document.getElementById('calendarGrid');
            titleEl.textContent = `${currentYear}년 ${currentMonth + 1}월 운행 달력`;
            gridEl.innerHTML = "";

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                gridEl.innerHTML += `<div class="h-32 bg-gray-50 rounded-lg opacity-40"></div>`;
            }

            for (let day = 1; day <= lastDay; day++) {
                const monthStr = String(currentMonth + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

                const log = logsData[dateKey];
                
                // 달력 묶음 바탕색 설정 (일정 종류에 따라 동일한 색으로 연결)
                let cellBgClass = 'bg-white border-gray-200 hover:border-blue-400';
                if (log) {
                    if (log.scheduleType === '1night' || (log.scheduleType === 'linked' && log.parentType === '1night')) {
                        cellBgClass = 'bg-indigo-100 border-indigo-300 hover:border-indigo-500';
                    } else if (log.scheduleType === '2night' || (log.scheduleType === 'linked' && log.parentType === '2night')) {
                        cellBgClass = 'bg-purple-100 border-purple-300 hover:border-purple-500';
                    }
                }

                let contentHTML = `<div class="text-[11px] text-gray-400 mt-1">입력 대기</div>`;

                if (log) {
                    const calc = calculateOvertime(log.startTime, log.endTime, log.isHoliday);
                    const allowance = calculateAllowance(log);
                    
                    // 정산 합계를 매 칸마다(1일차, 2일차 모두) 표시하도록 변경!
                    let allowanceHTML = '';
                    if (allowance > 0) {
                        allowanceHTML = `<div class="text-[11px] font-bold text-green-800 bg-green-200 rounded px-1 mt-0.5 truncate text-center shadow-sm">💰 ${allowance.toLocaleString()}원</div>`;
                    } else if (log.scheduleType === 'seoul' || (log.scheduleType === 'linked' && log.parentType === 'seoul')) {
                        allowanceHTML = `<div class="text-[11px] font-bold text-gray-600 bg-gray-200 rounded px-1 mt-0.5 truncate text-center shadow-sm">서울당일</div>`;
                    }

                    // 운전원 2가 없을 경우 공간 낭비 방지
                    const driver2HTML = log.driver2 ? `<div class="text-[11px] font-semibold text-indigo-900 bg-indigo-200 rounded px-1 truncate mt-0.5 shadow-sm">${log.driver2}</div>` : '';

                    // 휴일/평일 연장시간 텍스트 색상 분리
                    const payColor = log.isHoliday ? 'text-red-700 bg-red-100 border-red-200' : 'text-gray-800 bg-gray-100 border-gray-300';

                    // 9 ~ 18 시간표시를 없애고 컴팩트하게 구성된 최종 디자인
                    contentHTML = `
                        <div class="text-[11px] font-semibold text-blue-900 bg-blue-200 rounded px-1 truncate shadow-sm">${log.driver1}</div>
                        ${driver2HTML}
                        <div class="text-[10px] font-bold border rounded px-1 mt-1 ${payColor} truncate shadow-sm">${calc.label}: ${calc.totalPayTime}h</div>
                        ${allowanceHTML}
                    `;
                }

                gridEl.innerHTML += `
                    <div onclick="openModal('${dateKey}')" class="h-32 ${cellBgClass} border rounded-lg p-1 md:p-1.5 cursor-pointer transition shadow-sm flex flex-col overflow-hidden">
                        <span class="text-xs font-bold text-gray-800 ml-1">${day}</span>
                        <div class="overflow-hidden flex flex-col gap-0.5 mt-1">${contentHTML}</div>
                    </div>
                `;
            }
        }

        // 일정 선택 시 하단 박스 토글
        document.getElementById('scheduleType').addEventListener('change', function(e) {
            const val = e.target.value;
            const day2 = document.getElementById('day2Box');
            const day3 = document.getElementById('day3Box');

            if (val === '1night') {
                day2.classList.remove('hidden'); day3.classList.add('hidden');
                document.getElementById('startTime2').required = true;
                document.getElementById('endTime2').required = true;
                document.getElementById('startTime3').required = false;
                document.getElementById('endTime3').required = false;
            } else if (val === '2night') {
                day2.classList.remove('hidden'); day3.classList.remove('hidden');
                document.getElementById('startTime2').required = true;
                document.getElementById('endTime2').required = true;
                document.getElementById('startTime3').required = true;
                document.getElementById('endTime3').required = true;
            } else {
                day2.classList.add('hidden'); day3.classList.add('hidden');
                document.getElementById('startTime2').required = false;
                document.getElementById('endTime2').required = false;
                document.getElementById('startTime3').required = false;
                document.getElementById('endTime3').required = false;
            }
        });

        window.openModal = function(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modalDateTitle').textContent = `📅 ${dateStr} 운행 정보`;
            
            document.getElementById('logForm').reset();
            document.getElementById('day2Box').classList.add('hidden');
            document.getElementById('day3Box').classList.add('hidden');
            document.getElementById('scheduleType').disabled = false;

            const checkIsWeekend = (dStr) => {
                const day = new Date(dStr).getDay();
                return (day === 0 || day === 6);
            };

            // 기본 주말 자동체크
            document.getElementById('isHoliday1').checked = checkIsWeekend(dateStr);
            document.getElementById('isHoliday2').checked = checkIsWeekend(addDays(dateStr, 1));
            document.getElementById('isHoliday3').checked = checkIsWeekend(addDays(dateStr, 2));

            if (logsData[dateStr]) {
                const data = logsData[dateStr];
                document.getElementById('driver1').value = data.driver1 || "";
                document.getElementById('driver2').value = data.driver2 || "";
                document.getElementById('startTime1').value = data.startTime || "";
                document.getElementById('endTime1').value = data.endTime || "";
                document.getElementById('isHoliday1').checked = data.isHoliday || false;
                document.getElementById('memo').value = data.memo || "";
                document.getElementById('scheduleType').value = data.scheduleType || "none";

                // 연계 일정 수정 시 타입 변경은 막음
                if(data.scheduleType === 'linked') {
                    document.getElementById('scheduleType').disabled = true;
                }

                // 부모 일정일 경우 이어진 데이터(2일차, 3일차) 불러오기
                if (data.scheduleType === '1night' || data.scheduleType === '2night') {
                    document.getElementById('scheduleType').dispatchEvent(new Event('change'));
                    
                    const day2Data = logsData[addDays(dateStr, 1)];
                    if (day2Data) {
                        document.getElementById('startTime2').value = day2Data.startTime || "";
                        document.getElementById('endTime2').value = day2Data.endTime || "";
                        document.getElementById('isHoliday2').checked = day2Data.isHoliday || false;
                    }
                    
                    if (data.scheduleType === '2night') {
                        const day3Data = logsData[addDays(dateStr, 2)];
                        if (day3Data) {
                            document.getElementById('startTime3').value = day3Data.startTime || "";
                            document.getElementById('endTime3').value = day3Data.endTime || "";
                            document.getElementById('isHoliday3').checked = day3Data.isHoliday || false;
                        }
                    }
                }
            }

            document.getElementById('logModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('logModal').classList.add('hidden');
        }

        const timeInputs = document.querySelectorAll('input[type="number"]');
        timeInputs.forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
            });
            input.addEventListener('change', function() { this.blur(); });
        });

        document.getElementById('logModal').addEventListener('click', function() { window.closeModal(); });

        document.getElementById('logForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const scheduleType = document.getElementById('scheduleType').value;
            const driver1 = document.getElementById('driver1').value;
            const driver2 = document.getElementById('driver2').value;
            const memo = document.getElementById('memo').value;

            // ⭐ 날짜 더하기 기능이 완벽하게 작동하여 오늘, 내일, 모레를 정확히 찾아냅니다.
            const date1 = selectedDateStr;
            const date2 = addDays(date1, 1);
            const date3 = addDays(date1, 2);
            
            let currentParentType = "";
            if (logsData[date1] && logsData[date1].scheduleType === 'linked') {
                currentParentType = logsData[date1].parentType;
            }

            window.closeModal();

            try {
                // 연계 일정(2,3일차) 단일 칸만 눌러서 수정할 시
                if (scheduleType === 'linked') {
                    await setDoc(doc(db, "drivingLogs", date1), {
                        date: date1,
                        scheduleType: 'linked',
                        parentType: currentParentType,
                        driver1: driver1,
                        driver2: driver2,
                        startTime: document.getElementById('startTime1').value,
                        endTime: document.getElementById('endTime1').value,
                        isHoliday: document.getElementById('isHoliday1').checked,
                        memo: memo,
                        updatedAt: new Date()
                    });
                } else {
                    // 메인 1일차 등록/수정 시
                    await setDoc(doc(db, "drivingLogs", date1), {
                        date: date1,
                        scheduleType: scheduleType,
                        driver1: driver1,
                        driver2: driver2,
                        startTime: document.getElementById('startTime1').value,
                        endTime: document.getElementById('endTime1').value,
                        isHoliday: document.getElementById('isHoliday1').checked,
                        memo: memo,
                        updatedAt: new Date()
                    });

                    // 1박/2박일 경우 다음 날짜(내일, 모레)에 데이터 쪼개서 넣기
                    if (scheduleType === '1night' || scheduleType === '2night') {
                        await setDoc(doc(db, "drivingLogs", date2), {
                            date: date2,
                            scheduleType: 'linked',
                            parentType: scheduleType,
                            driver1: driver1,
                            driver2: driver2,
                            startTime: document.getElementById('startTime2').value,
                            endTime: document.getElementById('endTime2').value,
                            isHoliday: document.getElementById('isHoliday2').checked,
                            memo: memo + " (2일차)",
                            updatedAt: new Date()
                        });
                    }
                    if (scheduleType === '2night') {
                        await setDoc(doc(db, "drivingLogs", date3), {
                            date: date3,
                            scheduleType: 'linked',
                            parentType: scheduleType,
                            driver1: driver1,
                            driver2: driver2,
                            startTime: document.getElementById('startTime3').value,
                            endTime: document.getElementById('endTime3').value,
                            isHoliday: document.getElementById('isHoliday3').checked,
                            memo: memo + " (3일차)",
                            updatedAt: new Date()
                        });
                    }
                }
            } catch (error) {
                console.error("저장 실패: ", error);
                alert("데이터 저장에 실패했습니다.");
            }
        });
    </script>
</body>
</html>
