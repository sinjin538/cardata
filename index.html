<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차량 운행 및 출퇴근 달력 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* 모바일 브라우저에서 시간 선택 기본 아이콘 숨김 처리 */
        input[type="time"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <!-- 상단 달력 컨트롤러 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-gray-200 gap-4">
            <h1 id="calendarMonthTitle" class="text-2xl font-bold text-gray-800">2026년 8월 운행 달력</h1>
            <div class="flex items-center gap-2">
                <button onclick="changeMonth(-1)" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium">◀ 이전 달</button>
                <button onclick="changeMonth(1)" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-medium">다음 달 ▶</button>
            </div>
        </header>

        <!-- 달력 그리드 -->
        <div class="grid grid-cols-7 gap-1 text-center font-semibold text-gray-600 mb-2">
            <div class="text-red-500">일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div class="text-blue-500">토</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-2">
            <!-- 달력 날짜들이 동적으로 생성됩니다 -->
        </div>
    </div>

    <!-- 팝업 모달창 -->
    <div id="logModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl relative" onclick="event.stopPropagation()">
            <h2 id="modalDateTitle" class="text-xl font-bold text-gray-800 mb-4">날짜 운행 정보</h2>
            
            <form id="logForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">운전원 1</label>
                        <input type="text" id="driver1" placeholder="이름 입력" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">운전원 2</label>
                        <input type="text" id="driver2" placeholder="이름 입력" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">출근 시간 (시:분)</label>
                        <input type="time" id="startTime" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-center relative" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">퇴근 시간 (시:분)</label>
                        <input type="time" id="endTime" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-center relative" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">비고 및 목적</label>
                    <input type="text" id="memo" placeholder="예: 본사 ↔ 공장 왕복" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-medium">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase 설정 및 연동 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 본인의 파이어베이스 설정값으로 교체하세요
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); 
        let selectedDateStr = "";
        let logsData = {}; 

        // 실시간으로 데이터 가져와서 달력에 그리기
        onSnapshot(collection(db, "drivingLogs"), (snapshot) => {
            logsData = {};
            snapshot.forEach((doc) => {
                logsData[doc.id] = doc.data();
            });
            renderCalendar();
        });

        window.changeMonth = function(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function calculateOvertime(dateStr, startStr, endStr) {
            if (!startStr || !endStr) return { totalOvertimePayTime: 0 };

            const dateObj = new Date(dateStr);
            const dayOfWeek = dateObj.getDay(); 
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

            const [sHour, sMin] = startStr.split(':').map(Number);
            const [eHour, eMin] = endStr.split(':').map(Number);

            const startMinutes = sHour * 60 + sMin;
            const endMinutes = eHour * 60 + eMin;

            if (endMinutes <= startMinutes) return { totalOvertimePayTime: 0 };

            const standardStart = 9 * 60;  
            const standardEnd = 18 * 60; 

            let normalMins = 0;
            let overtimeMins = 0;

            if (isWeekend) {
                overtimeMins = endMinutes - startMinutes;
            } else {
                const overlapStart = Math.max(startMinutes, standardStart);
                const overlapEnd = Math.min(endMinutes, standardEnd);
                
                if (overlapEnd > overlapStart) {
                    normalMins = overlapEnd - overlapStart;
                }
                const totalMins = endMinutes - startMinutes;
                overtimeMins = Math.max(0, totalMins - normalMins);
            }

            const rawOvertimeHours = overtimeMins / 60;
            const totalOvertimePayTime = rawOvertimeHours * 1.5;

            return {
                totalOvertimePayTime: totalOvertimePayTime.toFixed(1)
            };
        }

        function renderCalendar() {
            const titleEl = document.getElementById('calendarMonthTitle');
            const gridEl = document.getElementById('calendarGrid');
            
            titleEl.textContent = `${currentYear}년 ${currentMonth + 1}월 운행 달력`;
            gridEl.innerHTML = "";

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                gridEl.innerHTML += `<div class="h-32 bg-gray-100 rounded-lg opacity-40"></div>`;
            }

            for (let day = 1; day <= lastDay; day++) {
                const monthStr = String(currentMonth + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${currentYear}-${monthStr}-${dayStr}`;

                const log = logsData[dateKey];
                let contentHTML = `<div class="text-xs text-gray-400 mt-1">입력 대기</div>`;

                if (log) {
                    const calc = calculateOvertime(dateKey, log.startTime, log.endTime);
                    contentHTML = `
                        <div class="text-[10px] text-blue-800 bg-blue-100 rounded px-1 truncate">1: ${log.driver1 || '-'}</div>
                        <div class="text-[10px] text-indigo-800 bg-indigo-100 rounded px-1 truncate">2: ${log.driver2 || '-'}</div>
                        <div class="text-[10px] text-gray-600 mt-0.5">${log.startTime || ''}~${log.endTime || ''}</div>
                        <div class="text-[10px] font-bold text-red-600 bg-red-50 border border-red-200 rounded px-1 mt-1">보상: +${calc.totalOvertimePayTime}시간</div>
                    `;
                }

                gridEl.innerHTML += `
                    <div onclick="openModal('${dateKey}')" class="h-32 bg-white border border-gray-200 rounded-lg p-2 cursor-pointer hover:border-blue-500 hover:shadow-sm transition flex flex-col justify-between">
                        <span class="text-sm font-semibold text-gray-800">${day}</span>
                        <div class="overflow-hidden">${contentHTML}</div>
                    </div>
                `;
            }
        }

        window.openModal = function(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modalDateTitle').textContent = `📅 ${dateStr} 운행 정보`;
            
            document.getElementById('driver1').value = "";
            document.getElementById('driver2').value = "";
            document.getElementById('startTime').value = "";
            document.getElementById('endTime').value = "";
            document.getElementById('memo').value = "";

            if (logsData[dateStr]) {
                const data = logsData[dateStr];
                document.getElementById('driver1').value = data.driver1 || "";
                document.getElementById('driver2').value = data.driver2 || "";
                document.getElementById('startTime').value = data.startTime || "";
                document.getElementById('endTime').value = data.endTime || "";
                document.getElementById('memo').value = data.memo || "";
            }

            document.getElementById('logModal').classList.remove('hidden');
        }

        // 모달창을 닫는 함수
        window.closeModal = function() {
            document.getElementById('logModal').classList.add('hidden');
        }

        // ⭐ 1. 시간 입력 완료 시 스피너/키보드 창 강제 닫힘 처리
        document.getElementById('startTime').addEventListener('change', function() {
            this.blur(); 
        });
        document.getElementById('endTime').addEventListener('change', function() {
            this.blur();
        });

        // 팝업 외부 배경 클릭 시 팝업 닫힘
        document.getElementById('logModal').addEventListener('click', function() {
            window.closeModal();
        });

        // ⭐ 2. 폼 제출 (저장 버튼 클릭) 시 동작 수정
        document.getElementById('logForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const driver1 = document.getElementById('driver1').value;
            const driver2 = document.getElementById('driver2').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const memo = document.getElementById('memo').value;

            // 핵심 변경: 데이터를 서버에 보내기 전에 먼저 팝업창부터 숨겨서 반응성을 높입니다!
            window.closeModal();

            try {
                // 뒤에서 파이어베이스 저장 실행
                await setDoc(doc(db, "drivingLogs", selectedDateStr), {
                    date: selectedDateStr,
                    driver1,
                    driver2,
                    startTime,
                    endTime,
                    memo,
                    updatedAt: new Date()
                });
            } catch (error) {
                console.error("저장 실패: ", error);
                alert("데이터 저장에 실패했습니다. 파이어베이스 설정을 확인하세요.");
            }
        });
    </script>
</body>
</html>
